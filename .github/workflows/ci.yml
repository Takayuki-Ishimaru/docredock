name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-license:
    name: build-test-license (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Install PDF test font and Japanese/English OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ipafont-gothic tesseract-ocr tesseract-ocr-jpn tesseract-ocr-eng
          tesseract --list-langs | grep -Fx jpn
          tesseract --list-langs | grep -Fx eng
      - name: Restore locked dependencies
        run: dotnet restore DocRedock.sln --locked-mode
      - name: Build
        run: dotnet build DocRedock.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/DocRedock.Tests/DocRedock.Tests.csproj --configuration Release --no-build --no-restore
      # Readable conversion regression guard: fixtures are synthetic and checked
      # into the public test suite. OCR dependencies are installed above.
      - name: Run conversion QA
        run: python3 tools/conversion-qa/run.py --all
      - name: Verify v0.2.3 quality-gate contracts
        run: python3 -m unittest tools/test_v023_quality_score.py
      - name: Run v0.2.3 source semantic suite
        run: python3 tools/v023_semantic_quality.py --source-cli src/DocRedock.Cli/bin/Release/net10.0/DocRedock.Cli --output artifacts/SOURCE-PDF-SEMANTICS-EVIDENCE.json
      - name: Verify licenses and generate SBOM
        run: dotnet run --project tools/LicenseAudit/LicenseAudit.csproj --configuration Release -- --root . --output artifacts

  # Linux (above) already covers conversion QA, quality gates, and license audit -- all of which
  # need apt-installed Tesseract/IPA-font dependencies this job does not install. This job is
  # narrower: prove the unit and headless GUI suites build and pass natively on Windows and macOS,
  # since most of the "never overwrite the original" guard's platform-specific behavior (junctions,
  # 8.3 short names, case sensitivity, firmlinks, hard links, symlinks, Unicode normalization) can
  # only be exercised on the OS it belongs to -- see OutputCollisionGuardPlatformTests and
  # FileIdentityTests. Every test that depends on apt-only tooling (Tesseract, IPA fonts) already
  # self-skips off Linux or is mocked, so no extra dependency installation is needed here.
  build-test-cross-platform:
    name: build-test-cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore DocRedock.sln --locked-mode
      - name: Build
        run: dotnet build DocRedock.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/DocRedock.Tests/DocRedock.Tests.csproj --configuration Release --no-build
      - name: Test GUI (headless)
        run: dotnet test tests/DocRedock.Gui.HeadlessTests/DocRedock.Gui.HeadlessTests.csproj --configuration Release --no-build
      # Smoke-tests that windows-ocr.ps1 actually executes under Windows PowerShell 5.1 (the engine
      # WindowsOcrEngine/CapabilityReporter invoke it with), not that a language pack is installed --
      # hosted runners typically ship only en-US, so an empty or partial result is expected and must
      # not fail the build. continue-on-error is the safety net for the one thing worth catching here
      # (the script failing to execute at all, e.g. a missing WinRT projection), which -ListLanguages
      # itself does not treat as fatal (see windows-ocr.ps1: it returns "[]" and exits 0).
      - name: Windows OCR script smoke (list installed language packs)
        if: matrix.os == 'windows-latest'
        shell: cmd
        continue-on-error: true
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\DocRedock.Ocr.Tesseract\windows-ocr.ps1" -ListLanguages
