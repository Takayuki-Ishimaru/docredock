name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Rtmd.sln --locked-mode
      - run: dotnet build Rtmd.sln --configuration Release --no-restore
      - run: dotnet test tests/Rtmd.Tests/Rtmd.Tests.csproj --configuration Release --no-build --no-restore
      - run: dotnet run --project tools/LicenseAudit/LicenseAudit.csproj --configuration Release -- --root . --output artifacts
