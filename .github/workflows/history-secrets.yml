name: history-secrets

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to scan; empty checks out the default event ref.
        required: false
        type: string
        default: ''
    outputs:
      commit:
        description: Checked-out HEAD commit after a successful scan.
        value: ${{ jobs.scan.outputs.commit }}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - name: Check out target history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        run: bash tools/scan-git-history.sh --fetch-pull-refs

      - name: Record scanned commit
        id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
